<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Fashion Accessories</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #faf7f8;
            color: #333;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin-bottom: 10px;
        }

        nav {
            margin-top: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }

        .hero {
            text-align: center;
            padding: 60px 20px;
            background: #f3e1e7;
        }

        .hero h2 {
            font-size: 35px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
        }

        .products {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .products h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .product-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .product .image {
            height: 220px;
            background: #eee;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
            font-size: 60px;
        }

        .product h3 {
            margin-bottom: 10px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            border: none;
            background: #222;
            color: white;
            padding: 12px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #555;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Fashion Accessories</h1>

        <nav>
            <a href="#">الرئيسية</a>
            <a href="#products">المنتجات</a>
            <a href="#">من نحن</a>
            <a href="#">تواصل معنا</a>
        </nav>
    </header>

    <section class="hero">
        <h2> ENG AMR SALMAN Fashion Accessories 👗</h2>
        <p>اكتشفي أحدث الموضة والإكسسوارات في مكان واحد</p>
    </section>

    <section class="products" id="products">

        <h2>منتجاتنا ✨</h2>

        <div class="product-container">

            <div class="product">
                <div class="image">👗</div>
                <h3>فستان أنيق</h3>
                <p class="price">750 جنيه</p>
                <button onclick="addToCart('فستان أنيق')">
                    أضف للسلة
                </button>
            </div>

            <div class="product">
                <div class="image">👜</div>
                <h3>شنطة نسائية</h3>
                <p class="price">450 جنيه</p>
                <button onclick="addToCart('شنطة نسائية')">
                    أضف للسلة
                </button>
            </div>

            <div class="product">
                <div class="image">👠</div>
                <h3>حذاء أنيق</h3>
                <p class="price">600 جنيه</p>
                <button onclick="addToCart('حذاء أنيق')">
                    أضف للسلة
                </button>
            </div>

        </div>
    </section>

    <footer>
        <p>© 2026 Fashion Accessories - جميع الحقوق محفوظة</p>
    </footer>

    <script>
        function addToCart(productName) {
            alert("تم إضافة " + productName + " إلى السلة 🛍️");
        }
    </script>

</body>
</html>
